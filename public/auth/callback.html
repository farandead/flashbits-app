<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0D0D0D;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00FF94;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to flashbits...</p>
    </div>
    <script>
        // Extract the OAuth parameters from the URL
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const idToken = urlParams.get('id_token');
        const accessToken = urlParams.get('access_token');
        const error = urlParams.get('error');
        
        // Also check query params (some OAuth flows use query params instead of hash)
        const queryParams = new URLSearchParams(window.location.search);
        const queryIdToken = queryParams.get('id_token');
        const queryError = queryParams.get('error');
        
        const finalIdToken = idToken || queryIdToken;
        const finalError = error || queryError;
        
        // Sanitize function to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        if (finalError) {
            // Handle error - sanitize error message
            const sanitizedError = escapeHtml(finalError);
            document.body.innerHTML = `
                <div class="container">
                    <h2>Authentication Error</h2>
                    <p>${sanitizedError}</p>
                    <p>Please try again.</p>
                </div>
            `;
        } else if (finalIdToken) {
            // Redirect to app with the token
            const appScheme = 'flashbits://auth';
            // Sanitize token before using in URL
            const sanitizedToken = encodeURIComponent(finalIdToken);
            const redirectUrl = `${appScheme}?id_token=${sanitizedToken}`;
            
            // Try to open the app
            window.location.href = redirectUrl;
            
            // Fallback: if app doesn't open, show instructions
            setTimeout(() => {
                // Use textContent for safe rendering instead of innerHTML with user data
                const container = document.querySelector('.container');
                if (container) {
                    container.innerHTML = `
                        <h2>Redirecting to app...</h2>
                        <p>If the app doesn't open automatically, <a href="${escapeHtml(redirectUrl)}" style="color: #00FF94;">click here</a></p>
                    `;
                }
            }, 2000);
        } else {
            // No token found
            document.body.innerHTML = `
                <div class="container">
                    <h2>No authentication token received</h2>
                    <p>Please try signing in again.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
